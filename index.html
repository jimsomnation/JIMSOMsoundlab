
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIMSOM soundlab</title>
    <meta name="description" content="An elegant music generation playground app that transforms prompts into complete songs, featuring an intuitive guided mode, high-quality video exports, and karaoke-style outputs for any track.">
    <meta property="og:title" content="JIMSOM soundlab">
    <meta property="og:description" content="An elegant music generation playground app that transforms prompts into complete songs, featuring an intuitive guided mode, high-quality video exports, and karaoke-style outputs for any track.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }
        .glass {
            background: rgba(11, 15, 26, 0.75);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .apple-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
        .creative-gradient {
            background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
        }
        .music-gradient {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .card-shadow:hover {
            box-shadow: 0 8px 36px rgba(0, 0, 0, 0.6), 0 0 25px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
            border: 2px solid #030712;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
